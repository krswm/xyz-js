<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>XYZ Molecule Visualizer</title>
    <meta name="application-name" content="XYZ Molecule Visualizer" />
    <meta
      name="description"
      content="For inspecting inputs and outputs of MLIPs"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="stylesheet" href="style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <label id="top-components">
      <input id="file-input" type="file" disabled />

      <div id="title">XYZ Molecule Visualizer</div>

      <div id="drop-click-text">JAVASCRIPT IS NECESSARY FOR THIS APP</div>

      <div id="energy-container">
        <div id="energy-text">ENERGY</div>
        <div id="energy-value">&mdash;</div>
      </div>
    </label>

    <div id="bottom-components">
      <div id="force-magnification-container">
        <div id="force-magnification-text">FORCE MAGNIFICATION</div>
        <input
          id="force-magnification-input"
          type="range"
          min="0"
          max="64"
          value="16"
          step="any"
        />
      </div>

      <button id="frame-prev-button">←</button>

      <div id="frame-container">
        <div id="frame-text">FRAME</div>
        <div id="frame-value">&mdash;</div>
      </div>

      <button id="frame-next-button">→</button>

      <a id="repo-link" href="https://github.com/krswm/xyz-js">
        <div>REPO ON GITHUB</div>
      </a>
    </div>

    <script src="main.js" type="module"></script>
  </body>
</html>
