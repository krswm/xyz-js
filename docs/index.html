<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="XYZ Molecule Visualizer • For visualizing inputs and outputs of MLIP"
    />
    <title>XYZ Molecule Visualizer</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="header">
      <div id="title">XYZ Molecule Visualizer</div>
      <label class="button-label">
        <div>
          DROP AN XYZ FILE ON THE WINDOW<br />
          OR CLICK HERE
        </div>
        <input id="file-input" type="file" accept="*" />
      </label>
      <a class="button-label" href="https://github.com/krswm/xyz-js">
        <div>
          REPO ON GITHUB<br />
          SOURCE CODE & MORE INFO
        </div>
      </a>
    </div>
    <div id="footer">
      <div id="energy"></div>
      <div id="molecule-frame"></div>
      <button id="molecule-frame-back">Back</button>
      <button id="molecule-frame-fore">Fore</button>
      <input
        id="force-magnification"
        type="range"
        min="0"
        max="100"
        value="10"
      />
    </div>
    <script src="main.js" type="module"></script>
  </body>
</html>

<XYZ Molecule Visualizer> <Drop an .xyz or .extxyz file / or click here> <GitHub / Source & more info>
