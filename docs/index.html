<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="XYZ Molecule Visualizer • For visualizing inputs and outputs of MLIP"
    />
    <title>XYZ Molecule Visualizer</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <label id="title-container">
      <div id="title">XYZ Molecule Visualizer</div>
      <div id="file-input-text">DROP AN XYZ FILE OR CLICK HERE</div>
      <div id="energy"></div>
      <input id="file-input" type="file" accept="*" />
    </label>

    <!--
    <label class="button-label" id="file-input-label">
      <div>
        DROP AN XYZ FILE<br />
        OR CLICK HERE
      </div>
    </label>
    -->

    <a
      class="button-label"
      href="https://github.com/krswm/xyz-js"
      id="repo-link"
    >
      <div>
        REPO ON GITHUB<br />
        INFO & SOURCE
      </div>
    </a>

    <div id="molecule-frame-controller">
      <button class="button-label" id="molecule-frame-back">←</button>
      <div id="molecule-frame"></div>
      <button class="button-label" id="molecule-frame-fore">→</button>
    </div>

    <input id="force-magnification" type="range" min="0" max="100" value="10" />

    <script src="main.js" type="module"></script>
  </body>
</html>
