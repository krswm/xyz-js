<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="XYZ Molecule Visualizer • For visualizing inputs and outputs of MLIP"
    />
    <title>XYZ Molecule Visualizer</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="header">
      <div id="title">XYZ Molecule Visualizer</div>
      <div id="repo-link">
        <a href="https://github.com/krswm/xyz-js"
          >Source code and more info on GitHub</a
        >
      </div>
    </div>
    <div id="footer">
      <input id="file-input" type="file" accept="*" />
      <div id="energy"></div>
    </div>
    <script src="main.js" type="module"></script>
  </body>
</html>
