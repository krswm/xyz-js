<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="XYZ Molecule Visualizer • For visualizing inputs and outputs of MLIP"
    />
    <title>XYZ Molecule Visualizer</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <label id="file-input-button">
      <div id="title">XYZ Molecule Visualizer</div>
      <div id="drop-click-text">DROP AN XYZ FILE OR CLICK HERE</div>
      <div id="energy-container">
        <div id="energy-text">ENERGY</div>
        <div id="energy-value"></div>
      </div>
      <input id="file-input" type="file" accept="*" />
    </label>

    <a class="button" href="https://github.com/krswm/xyz-js" id="repo-link">
      <div>
        REPO ON GITHUB<br />
        INFO & SOURCE
      </div>
    </a>

    <div id="molecule-frame-controller">
      <button class="button" id="molecule-frame-back">←</button>
      <div id="molecule-frame"></div>
      <button class="button" id="molecule-frame-fore">→</button>
    </div>

    <input id="force-magnification" type="range" min="0" max="100" value="10" />

    <script src="main.js" type="module"></script>
  </body>
</html>
